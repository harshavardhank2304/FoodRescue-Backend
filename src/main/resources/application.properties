spring.application.name=foodrescue-backend

# =========================
# Database
# =========================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# =========================
# JPA / Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# =========================
# JWT
# =========================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# =========================
# Server
# =========================
server.port=${PORT:8080}

# =========================
# Actuator
# =========================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# =========================
# Cache
# =========================
spring.cache.type=simple

# =========================
# Async thread pool
# =========================
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10

# =========================
# Logging
# =========================
logging.level.com.foodrescue=DEBUG
logging.level.org.springframework.security=WARN

# =========================
# CORS
# =========================
# Comma-separated list of origins allowed to call this API.
# Override in Render environment variables with CORS_ALLOWED_ORIGINS.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}