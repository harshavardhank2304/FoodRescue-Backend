spring.application.name=foodrescue-backend-test

# In-memory H2 with MySQL mode and keep alive
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate DDL for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT test properties
jwt.secret=FoodRescueSecretKey2024VeryLongSecretKeyForJWTTokenGeneration
jwt.expiration=86400000

# Cache
spring.cache.type=simple
